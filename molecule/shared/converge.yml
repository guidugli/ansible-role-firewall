---
- name: Converge
  hosts: all
  gather_facts: true
  vars:
    firewall_selected: "{{ _suggested_os_firewall }}"
    firewalld_default_zone: public
    firewall_default_protocol: tcp
    firewall_default_action: allow
    firewall_service_mapping:
      - name: ssh
        ports: ['19999/tcp']
      - name: cockpit
        ports: ['9090/tcp']
      - name: kodi
        # Description will only be used for new services
        description: This option allows kodi remote controls to communicate with kodi application
        short: Allows kodi remotes to access kodi
        ports: ['18998/tcp']
      - name: dhcpv6-client
        ports: ['546/udp']
    firewall_output_default_action: allow
    firewall_output_allow_ports:
      - { port: 80, protocol: tcp }
      - { port: 443, protocol: tcp }
      - { port: 53, protocol: tcp }
      - { port: 53, protocol: udp }
      - { port: 67, protocol: tcp }
      - { port: 67, protocol: udp }
    firewall_services:
      - name: ssh
      - name: kodi
      - name: cockpit
        action: deny
      - name: dhcpv6-client
        action: deny
  pre_tasks:
    - name: Determine if the selected backend is supported in this Molecule context
      ansible.builtin.set_fact:
        firewall_molecule_backend_supported: >-
          {{ firewall_selected != 'firewalld' or ansible_facts['service_mgr'] == 'systemd' }}
      tags:
        - firewall
        - validate

    - name: Explain skipped firewall role execution in non-systemd containers
      ansible.builtin.debug:
        msg: >-
          Skipping firewalld execution on {{ inventory_hostname }} because this
          Molecule scenario is not systemd-managed. The systemd scenario covers
          firewalld hosts.
      when:
        - not firewall_molecule_backend_supported | bool
      changed_when: false
      tags:
        - firewall
        - validate

    - name: End host for unsupported non-systemd firewalld Molecule context
      ansible.builtin.meta: end_host
      when:
        - not firewall_molecule_backend_supported | bool
      tags:
        - firewall
        - validate
  roles:
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
      tags:
        - firewall
        - config
