---
_firewalld_info:
  packages:
    default:
      - firewalld
  service_name:
    default: firewalld
  conflicting_services:
    default:
      - ufw
      - iptables
      - ip6tables
      - nftables

_ufw_info:
  packages:
    default:
      - ufw
  service_name:
    default: ufw
  conflicting_services:
    default:
      - firewalld
      - iptables
      - ip6tables
      - nftables

_preferred_os_firewall:
  default: ufw
  Fedora: firewalld
  Debian: ufw
  Ubuntu: ufw

_firewall_iptables_rulefile:
  Alpine: /etc/iptables/rules-save

_container_types:
  - docker
  - podman
  - lxc
  - containerd
  - container
